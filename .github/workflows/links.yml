# Live check of every photo, source and shop link. Needs the network, so it runs on a schedule
# (GitHub emails the repo owner when it fails), on demand, and on pull requests that change the data.
name: Links
on:
  schedule:
    - cron: '0 1 * * 1'   # Mondays 01:00 UTC (09:00 in Malaysia)
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/content/**'
      - 'src/data/profile.json'

# read-only token: these jobs also run on pull requests from forks
permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/check-links.mjs   # Node built-ins only, no npm install needed
